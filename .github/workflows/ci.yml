name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
    inputs:
      run_data_test:
        description: Run conversion identity (requires the online delphi-eos runner)
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build (${{ matrix.channel }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # production = the release recorded in .github/key4hep-production-release
        # stable     = whatever the stable channel currently resolves to
        channel: [production, stable]
    steps:
      - uses: actions/checkout@v4

      - name: Mount cvmfs (DELPHI + key4hep)
        uses: cvmfs-contrib/github-action-cvmfs@v5
        with:
          cvmfs_repositories: 'delphi.cern.ch,sw.hsf.org'

      # Trigger the autofs mounts on the host before handing /cvmfs to
      # docker — binding an un-triggered autofs root gives empty dirs.
      - name: Warm cvmfs mounts
        run: ls /cvmfs/delphi.cern.ch /cvmfs/sw.hsf.org

      - name: Build and test (AlmaLinux 9)
        run: |
          docker run --rm \
            -v /cvmfs:/cvmfs:shared \
            -v ${{ github.workspace }}:/repo \
            almalinux:9 \
            bash /repo/.github/scripts/ci-build.sh ${{ matrix.channel }}

      - name: Record the stack this run used
        if: always()
        run: |
          echo "key4hep \`${{ matrix.channel }}\` -> \`$(cat .key4hep-resolved 2>/dev/null || echo unknown)\`" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the build for the data test
        if: matrix.channel == 'production'     # stable is a build-only canary
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build/delphi_sdst_pass
            build/delphi_fdst_pass
            build/delphi_btag_check
          retention-days: 5

  # The build stays on the GitHub-hosted runner; only the binaries are sent to
  # the test machine, which has 2 cores.
  #
  # The runner is deliberately optional: an unavailable self-hosted runner
  # otherwise leaves every workflow queued until GitHub cancels it after 24h.
  # Set the repository variable DELPHI_DATA_CI_ENABLED=true once the runner is
  # registered and online. A trusted maintainer can also request this job from
  # workflow_dispatch without changing the variable.
  #
  # Before enabling it for pull requests, configure:
  #   Settings > Actions > General > Fork pull request workflows from outside
  #     collaborators -> "Require approval for all external contributors"
  #   Settings > Environments -> data-test (add required reviewers if desired)
  #
  # No repository secrets are used, and no step here runs a privileged command.
  # The inputs are CERN Open Data; data-test.sh sets
  # DELPHI_DATA_ROOT=/eos/opendata/delphi.
  data-test:
    name: conversion identity (lepdata-edm4hep)
    needs: build-and-test          # waits for every matrix channel
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_data_test) ||
      (vars.DELPHI_DATA_CI_ENABLED == 'true' &&
       (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, delphi-eos]
    environment: data-test
    timeout-minutes: 45
    concurrency:
      group: lepdata-edm4hep       # one run at a time on the machine
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build, path: build }
      - run: chmod +x build/delphi_sdst_pass build/delphi_fdst_pass build/delphi_btag_check
      - name: Convert and compare against the blessed references
        run: bash .github/scripts/data-test.sh

  # Runs where the blessed references live, and only once the identity test has
  # accepted them: the collection map is generated from those references, so
  # the page cannot describe an output the tests have not seen.
  docs-build:
    name: docs (build)
    needs: data-test
    runs-on: [self-hosted, delphi-eos]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build the collection map and the API docs
        run: bash .github/scripts/docs-build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  # Deploy only from dev. Deliberately does NOT check out: that keeps this
  # job's token scoped to pages/id-token only, matching GitHub's own Pages
  # pattern, and leaves exactly one writer to the Pages site.
  docs-deploy:
    name: docs (deploy)
    needs: docs-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
